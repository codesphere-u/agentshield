name: AgentShield CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Audit runtime dependencies with pip-audit
        run: |
          uv export --no-emit-project --no-hashes --no-dev --format requirements-txt > runtime-requirements.txt
          uvx pip-audit -r runtime-requirements.txt --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t agentshield:ci .

      - name: Verify non-root container & package import
        run: docker run --rm agentshield:ci python -c "import os, agentshield; assert os.geteuid() != 0"

  test-and-benchmark:
    name: Lint, Typecheck, Test & OWASP Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run Ruff linter
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run Mypy type checker
        run: uv run --python ${{ matrix.python-version }} mypy agentshield

      - name: Run Pytest suite with coverage
        run: uv run --python ${{ matrix.python-version }} pytest -v --cov=agentshield --cov-report=term-missing --cov-fail-under=85

      - name: Execute 25-Scenario OWASP 2026 Benchmark Suite
        run: uv run --python ${{ matrix.python-version }} agentshield evaluate --output benchmark_report.md
